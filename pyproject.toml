[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subsetaudit"
version = "0.1.1"
description = "字体派生产物体检：子集正确性审计（覆盖 / 布局 / 许可 / 元数据）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["font", "opentype", "subset", "audit", "fonttools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Text Processing :: Fonts",
]
dependencies = ["fonttools>=4.40,<5"]

[project.optional-dependencies]
# `PyYAML` 是 `tests/test_ci_workflow.py` 的**唯一**用途：那组测试解析 `.github/workflows/ci.yml`
# 断言"门/夹具/发布门的步骤顺序"。它本地常因 pyyaml 恰好在场而跑、在 CI 里却因缺依赖被
# `pytest.importorskip("yaml")` 整模块跳过 —— 于是"CI 顺序被写错"这类缺陷在 CI 里**无人看守**。
# 2026-10-21 M6 首推实测：正是这个盲区让"变异验证排在 install 之前"的错序溜进了远端（四格子同红）。
# 既然这组测试的判据就是 CI 顺序，就必须保证它在 CI 里真的跑起来 → 显式声明依赖。
dev = ["pytest>=7,<9", "PyYAML>=5.4"]

[project.scripts]
subsetaudit = "subsetaudit.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/subsetaudit"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
