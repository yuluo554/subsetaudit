name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "test / py${{ matrix.python }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    # 三条编码纪律：PYTHONUTF8 救 CI 全部步骤（`py -X utf8` 只是本机习惯，
    # 它改不了 CI 和子进程）；PYTHONDONTWRITEBYTECODE 防 pyc 偶发损坏污染测试；
    # PYTHONIOENCODING 兜底 stdio。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # 注意：用 `python` 而不是 `py`——`py` 是 Windows 专用启动器，ubuntu runner 上没有。
      # 这两道门**顶层只用标准库**，刻意放在 install 之前：它们要能在"干净 checkout、什么都没装"
      # 时跑（`tests/test_ci_workflow.py::test_gates_are_stdlib_only...` 钉住）。
      - name: "Sprint layout gate (methodology binding)"
        run: python tools/check_sprint_layout.py

      - name: "Desensitization gate (no host paths / usernames / local proxy)"
        run: python tools/check_desensitized.py

      - name: "Install (editable) with dev extras"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # M1 数据层：产物不入仓 → CI 里必须先全量生成，再做位级比对。
      # 生成期自证（独立 oracle）在 `gen_fixtures.py` 内部，任何不符直接 exit 1。
      # **必须早于"变异验证"与"发布门"**：两者都会复跑 `gen_fixtures.py --check`，
      # 而 `--check` 是比较"重生成"与"仓库产物"—— 产物不存在时它只会报缺失。
      - name: "Fixtures — generate F1-F6 (with built-in independent oracle)"
        run: python tools/gen_fixtures.py

      - name: "Fixtures — bit-level reproducibility (--check)"
        run: python tools/gen_fixtures.py --check

      # 变异验证放在 install **之后**：它现在会连**发布门**一起跑，而发布门要复跑
      # `gen_fixtures.py --check`（需要 fontTools，且要有产物）。脚本自身仍是 stdlib-only
      # （发布门用 AST 静态解析 cli.py，不 import 包）—— 依赖来自它编排的被测门，
      # 不是它自己的 import（`tests/test_ci_workflow.py` 两处断言分别钉这两件事）。
      # 实测背景（2026-10-21 首推）：放在 install 之前 → 四格子同红，且红在
      # `RELEASE.FIXTURES_BITWISE gen_fixtures --check rc=1 ModuleNotFoundError: fontTools`。
      - name: "Gate mutation verification (every judging rule must be falsifiable)"
        run: python tools/verify_gates.py

      # `--check` 必须**离线可跑**：CI 没有下载 OFL 字体 → 期望 exit 1 且逐条报 MISSING，
      # 但**不得**抛 traceback（"缺文件报 MISSING 而不是崩"是 M1 的 DoD）。
      - name: "OFL lock — offline check reports MISSING without crashing"
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_fonts.py --list
          set +e
          out=$(python tools/fetch_fonts.py --check 2>&1); rc=$?
          set -e
          echo "$out"
          test $rc -eq 1
          echo "$out" | grep -q "MISSING"
          if echo "$out" | grep -q "Traceback"; then echo "check 崩了"; exit 1; fi

      # README 的安装段必须在"干净 venv"里真敲一遍（含升级 pip 这个前置条件）——
      # clone 有 .git 和已装依赖，结构上就比用户环境多东西（发布包实测纪律）。
      - name: "README install path (clean venv, real keystrokes)"
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-readme
          if [ -x .venv-readme/bin/python ]; then VPY=.venv-readme/bin/python; SUB=.venv-readme/bin/subsetaudit; else VPY=.venv-readme/Scripts/python.exe; SUB=.venv-readme/Scripts/subsetaudit.exe; fi
          "$VPY" -m pip install --upgrade pip
          "$VPY" -m pip install -e ".[dev]"
          "$SUB" --version
          "$SUB" license-gate does-not-exist.ttf || test $? -eq 2

      - name: "Tests"
        run: python -m pytest -q

      # 每条已交付命令都要有一条离线冒烟（"绿矩阵"不是"它跑过"的证据）
      - name: "Smoke — five subcommands on a synthetic font"
        run: python tools/smoke_cli.py

      # 发布终态门（M6）：CI 里只跑 `--pre-tag`（只落仓库内文件、零网络）——
      # `--online` 需要远端事实与 gh token，属发布棒手工动作，不进 CI。
      - name: "Release gate (pre-tag, offline)"
        run: python tools/check_release.py --pre-tag
